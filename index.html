<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GerardTheBanana</title>
<meta name="description" content="GerardTheBanana — стример и художник. Работы, соцсети и цены на комишки.">
<meta name="theme-color" content="#245edb">
<meta property="og:type" content="website">
<meta property="og:title" content="GerardTheBanana">
<meta property="og:description" content="Работы, соцсети и комишки GerardTheBanana.">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="style.css">
<!--
  КАК РЕДАКТИРОВАТЬ САЙТ
  Весь контент (имя, описание, ссылки, работы, цены) находится в блоке CONFIG в начале script.js.
  • Новая работа: положите файл в assets/artworks/ и добавьте строку в CONFIG.artworks.
    Для быстрой сетки добавьте уменьшенную копию (например assets/artworks/thumbs/artwork-01.jpg)
    и укажите её в поле thumbnail.
  • Описание: CONFIG.about.text. Аватарка: assets/avatar.png.
  • Ссылки: CONFIG.socials. Цены: CONFIG.commissions.
  • Заголовок вкладки: <title> выше и CONFIG.title.
  • Обои: assets/wallpapers/bliss.jpg. Шрифт: assets/fonts/PixelUltima.woff2.
-->
</head>
<body>
<div class="wallpaper" aria-hidden="true"></div>

<main class="desktop" id="desktop">
  <h1 class="logo" id="siteName">GerardTheBanana</h1>

  <section class="win" id="about" data-title="О стримере" aria-label="О стримере">
    <div class="body">
      <div class="about">
        <div class="avatar" id="avatar"></div>
        <div>
          <h2 id="aboutName"></h2>
          <p id="aboutText"></p>
        </div>
      </div>
      <dl class="info" id="aboutInfo"></dl>
    </div>
  </section>

  <section class="win" id="artwork" data-title="Работы" aria-label="Работы">
    <div class="body" id="gallery"></div>
  </section>

  <section class="win" id="socials" data-title="Соцсети" aria-label="Соцсети">
    <div class="body"><ul class="links" id="socialList"></ul></div>
  </section>

  <section class="win" id="commissions" data-title="Комишки" aria-label="Комишки">
    <div class="body" id="prices"></div>
    <footer class="foot">
      <a class="xp-btn big" id="orderBtn" href="https://t.me/gerardthebanana" target="_blank" rel="noopener noreferrer">Заказать / Написать в Telegram</a>
    </footer>
  </section>
</main>

<section class="win viewer" id="viewer" data-title="Artwork Viewer" role="dialog" aria-label="Просмотр работы" hidden>
  <div class="body">
    <div class="stage" id="stage"></div>
    <p class="vdesc" id="vdesc"></p>
    <div class="vbar">
      <button class="xp-btn nav" id="prev" type="button" aria-label="Предыдущая работа">←</button>
      <span id="vinfo" aria-live="polite"></span>
      <button class="xp-btn nav" id="next" type="button" aria-label="Следующая работа">→</button>
    </div>
  </div>
</section>

<nav class="start-menu" id="startMenu" aria-label="Меню Start" hidden></nav>

<footer class="taskbar">
  <button class="start" id="start" type="button" aria-expanded="false">start</button>
  <div class="tasks" id="tasks"></div>
  <div class="tray"><span id="clock">--:--</span></div>
</footer>

<script src="script.js"></script>
</body>
</html>
